<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login - Sistem Tabungan Haji BSI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link

    />

      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#281900",
              "on-primary": "#ffffff",
              "secondary-container": "#feb316",
              "tertiary-container": "#47a69b",
              "on-surface": "#121c28",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed": "#00201d",
              "inverse-on-surface": "#eaf1ff",
              "secondary-fixed-dim": "#ffba3b",
              "error-container": "#ffdad6",
              "on-tertiary-container": "#003631",
              error: "#ba1a1a",
              "on-secondary-fixed-variant": "#604100",
              "on-tertiary": "#ffffff",
              "surface-container-low": "#eef4ff",
              tertiary: "#006a61",
              outline: "#6c7a77",
              "outline-variant": "#bbc9c6",
              "inverse-surface": "#27313e",
              primary: "#006a62",
              "primary-container": "#00a99d",
              "on-primary-fixed-variant": "#00504a",
              "on-surface-variant": "#3c4947",
              "on-secondary-container": "#6a4800",
              "on-secondary": "#ffffff",
              "surface-bright": "#f8f9ff",
              surface: "#f8f9ff",
              "surface-container": "#e5eeff",
              "tertiary-fixed": "#96f3e6",
              "on-primary-container": "#003631",
              "on-error": "#ffffff",
              "inverse-primary": "#59dacd",
              "on-error-container": "#93000a",
              "secondary-fixed": "#ffdead",
              background: "#f8f9ff",
              "on-tertiary-fixed-variant": "#005049",
              "on-background": "#121c28",
              "surface-tint": "#006a62",
              "surface-container-highest": "#d9e3f4",
              "surface-variant": "#d9e3f4",
              "primary-fixed": "#78f7e9",
              secondary: "#7f5700",
              "tertiary-fixed-dim": "#7ad6ca",
              "surface-container-high": "#dfe9fa",
              "surface-dim": "#d1dbec",
              "primary-fixed-dim": "#59dacd",
              "on-tertiary-fixed": "#00201d",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "container-max": "1280px",
              gutter: "24px",
              "stack-lg": "24px",
              margin: "32px",
              "stack-md": "16px",
              "stack-xl": "48px",
              "stack-xs": "4px",
              "stack-sm": "8px",
            },
            fontFamily: {
              "label-sm": ["Inter"],
              "display-lg": ["Inter"],
              "label-md": ["Inter"],
              "body-lg": ["Inter"],
              "headline-lg": ["Inter"],
              "title-lg": ["Inter"],
              "headline-md": ["Inter"],
              "body-sm": ["Inter"],
              "body-md": ["Inter"],
            },
            fontSize: {
              "label-sm": ["12px", { lineHeight: "16px", fontWeight: "600" }],
              "display-lg": [
                "48px",
                {
                  lineHeight: "60px",
                  letterSpacing: "-0.02em",

                },
              ],
              "label-md": [

                },
              ],
              "title-lg": ["20px", { lineHeight: "28px", fontWeight: "600" }],
              "headline-md": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            },
          },
        },
      };

    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
  </head>
  <body
    class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden"
  >
    <!-- Ambient Background Texture -->
    <div class="absolute inset-0 z-0">
      <img
        alt="A subtle, high-end abstract background featuring faint, modern geometric patterns. The color palette is bright and professional, utilizing soft, luminous teal and mint green gradients that evoke a sense of security, trustworthiness, and modern banking. The lighting is soft and diffused, creating a clean, corporate light-mode aesthetic without being distracting."
        class="w-full h-full object-cover opacity-20"
        data-alt="A subtle, high-end abstract background featuring faint, modern Islamic geometric patterns. The color palette is bright and professional, utilizing soft, luminous teal and mint green gradients that evoke a sense of security, trustworthiness, and modern banking. The lighting is soft and diffused, creating a clean, corporate light-mode aesthetic without being distracting."
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0G13JR-YGIAuRyJdFp89ifTVveSsh0i-ae60zFplHROGtbuuG6weYudKFIgd-1Xso0kUtV1LWFL14_EBx4CLkrV_f0W5WLv8dZvjzFnnpvby22xEhTQXeRKpCOETMgiD8NBZshF4lQv4l1iAgfd5fVeqwQk4XuOn-ShloHVlWuzQ4aPJ3Ez36IWsaNrSOzf4tBtu8fjgI8QiGmoeLkObP_tiFpGnVX8t5x77oQ0ro_9ZizSyRGvSpOcKfPzZJ4Nd77wo3TTY55D4"
      />
      <div
        class="absolute inset-0 bg-gradient-to-br from-surface/80 to-surface-container/90"
      ></div>
    </div>
    <!-- Login Card Canvas -->
    <main class="relative z-10 w-full max-w-md px-gutter">
      <div
        class="bg-surface-container-lowest rounded-xl shadow-lg border border-surface-variant overflow-hidden"
      >
        <!-- Header Section -->
        <div
          class="p-margin pb-stack-lg flex flex-col items-center text-center border-b border-surface-variant bg-surface-bright/50"
        >
          <div
            class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-stack-md shadow-sm"
          >
            <span
              class="material-symbols-outlined text-[32px] text-on-primary-container"
              style="font-variation-settings: &quot;FILL&quot; 1"
            >
              account_balance
            </span>
          </div>
          <h1
            class="font-headline-md text-headline-md text-primary tracking-tight"
          >
            Sistem Tabungan Haji
          </h1>
          <p
            class="font-body-sm text-body-sm text-on-surface-variant mt-stack-xs"
          >
            Bank Syariah Indonesia
          </p>
        </div>
        <!-- Form Section -->
        <div class="p-margin pt-stack-lg">
          <form action="#" class="flex flex-col gap-stack-md" method="POST">
            <!-- Email Field -->
            <div>
              <label
                class="block font-label-md text-label-md text-on-surface mb-stack-xs"
                for="email"
              >
                Email Petugas
              </label>
              <div class="relative">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <span class="material-symbols-outlined text-outline">
                    mail
                  </span>
                </div>
                <input
                  class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200"
                  id="email"
                  name="email"
                  placeholder="petugas@bsi.co.id"
                  required=""
                  type="email"
                />
              </div>
            </div>
            <!-- Password Field -->
            <div>
              <div class="flex justify-between items-center mb-stack-xs">
                <label
                  class="block font-label-md text-label-md text-on-surface"
                  for="password"
                >
                  Kata Sandi
                </label>
              </div>
              <div class="relative">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <span class="material-symbols-outlined text-outline">
                    lock
                  </span>
                </div>
                <input
                  class="w-full pl-10 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200"
                  id="password"
                  name="password"
                  placeholder="••••••••"
                  required=""
                  type="password"
                />
                <button
                  class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary transition-colors cursor-pointer focus:outline-none"
                  type="button"
                >
                  <span class="material-symbols-outlined">
                    visibility_off
                  </span>
                </button>
              </div>
            </div>
            <!-- Action Button -->
            <div class="pt-stack-sm mt-stack-xs">
              <button
                class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200"
                type="submit"
              >
                Masuk
                <span class="material-symbols-outlined text-[18px]">
                  arrow_forward
                </span>
              </button>
            </div>
          </form>
        </div>
        <!-- Footer Warning -->
        <div
          class="px-margin py-stack-md bg-error-container/30 border-t border-surface-variant flex items-start gap-3"
        >
          <span
            class="material-symbols-outlined text-error mt-0.5 text-[20px]"
            style="font-variation-settings: &quot;FILL&quot; 1"
          >
            warning
          </span>
          <p class="font-label-sm text-label-sm text-on-surface-variant">
            Sistem ini terenkripsi dan
            <span class="font-bold text-error">Hanya untuk petugas BSI</span>
            yang berwenang. Akses tidak sah akan dilacak.
          </p>
        </div>
      </div>
      <!-- Subtle Bottom Branding -->
      <div class="mt-stack-lg text-center">
        <p class="font-label-sm text-label-sm text-on-surface-variant/70">
          © 2024 Bank Syariah Indonesia. All rights reserved.
        </p>
      </div>
    </main>
  </body>
</html>
